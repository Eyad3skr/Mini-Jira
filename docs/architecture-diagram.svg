<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="system-ui, Segoe UI, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#374151"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #1e40af; stroke-width: 1.5; rx: 6; }
      .az { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1; stroke-dasharray: 6 4; }
      .title { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .label { fill: #334155; }
      .note { fill: #64748b; font-size: 10px; }
    </style>
  </defs>
  <text x="20" y="28" class="title">Mini-Jira  Production topology (eu-north-1, 2 AZ)</text>
  <text x="20" y="48" class="note">Logical topology — see docs/ARCHITECTURE-DIAGRAM.md for AWS Architecture Icons export</text>

  <!-- Users -->
  <rect x="420" y="60" width="120" height="40" class="box"/>
  <text x="480" y="85" text-anchor="middle" class="label">Users / Browser</text>

  <!-- CloudFront -->
  <rect x="380" y="120" width="200" height="44" class="box"/>
  <text x="480" y="147" text-anchor="middle" class="label">CloudFront (E19LM6JGGQ56CX)</text>

  <line x1="480" y1="100" x2="480" y2="120" stroke="#374151" marker-end="url(#arrow)"/>

  <!-- VPC -->
  <rect x="40" y="190" width="1020" height="500" class="az"/>
  <text x="60" y="215" class="label" font-weight="600">VPC mini-jira-vpc  10.0.0.0/24 + 10.2.0.0/24</text>

  <!-- AZ 1a -->
  <rect x="60" y="230" width="480" height="440" class="az"/>
  <text x="80" y="252" class="label" font-weight="600">eu-north-1a</text>

  <rect x="80" y="270" width="200" height="70" class="box"/>
  <text x="180" y="298" text-anchor="middle" class="label">Public subnet</text>
  <text x="180" y="318" text-anchor="middle" class="note">10.0.0.0/25  ALB, NAT 1a</text>

  <rect x="80" y="360" width="200" height="70" class="box"/>
  <text x="180" y="388" text-anchor="middle" class="label">Private subnet</text>
  <text x="180" y="408" text-anchor="middle" class="note">10.2.0.0/25  EC2 ASG</text>

  <!-- AZ 1b -->
  <rect x="560" y="230" width="480" height="440" class="az"/>
  <text x="580" y="252" class="label" font-weight="600">eu-north-1b</text>

  <rect x="580" y="270" width="200" height="70" class="box"/>
  <text x="680" y="298" text-anchor="middle" class="label">Public subnet</text>
  <text x="680" y="318" text-anchor="middle" class="note">10.0.0.128/25  ALB, NAT 1b</text>

  <rect x="580" y="360" width="200" height="70" class="box"/>
  <text x="680" y="388" text-anchor="middle" class="label">Private subnet</text>
  <text x="680" y="408" text-anchor="middle" class="note">10.2.0.128/25  EC2 ASG</text>

  <!-- ALB -->
  <rect x="300" y="285" width="160" height="50" class="box"/>
  <text x="380" y="315" text-anchor="middle" class="label">ALB (public, 2 AZ)</text>

  <!-- EC2 -->
  <rect x="300" y="375" width="160" height="50" class="box"/>
  <text x="380" y="400" text-anchor="middle" class="label">EC2 ASG mini-jira-asg</text>
  <text x="380" y="418" text-anchor="middle" class="note">no public IP  SSM admin</text>

  <!-- NAT outbound -->
  <rect x="300" y="455" width="160" height="40" class="box"/>
  <text x="380" y="480" text-anchor="middle" class="label">NAT ’ outbound AWS APIs</text>

  <line x1="480" y1="164" x2="380" y2="285" stroke="#374151" marker-end="url(#arrow)"/>
  <line x1="380" y1="335" x2="380" y2="375" stroke="#374151" marker-end="url(#arrow)"/>
  <line x1="380" y1="425" x2="380" y2="455" stroke="#374151" marker-end="url(#arrow)"/>

  <!-- Regional services -->
  <rect x="820" y="280" width="200" height="44" class="box"/>
  <text x="920" y="307" text-anchor="middle" class="label">Cognito User Pool</text>

  <rect x="820" y="340" width="200" height="44" class="box"/>
  <text x="920" y="367" text-anchor="middle" class="label">DynamoDB</text>

  <rect x="820" y="400" width="96" height="44" class="box"/>
  <text x="868" y="427" text-anchor="middle" class="label">S3 originals</text>

  <rect x="924" y="400" width="96" height="44" class="box"/>
  <text x="972" y="427" text-anchor="middle" class="label">S3 resized</text>

  <rect x="820" y="460" width="200" height="44" class="box"/>
  <text x="920" y="487" text-anchor="middle" class="label">Lambda image-resize</text>

  <rect x="820" y="520" width="200" height="44" class="box"/>
  <text x="920" y="540" text-anchor="middle" class="label">SNS ’ SQS ’ worker »</text>
  <text x="920" y="556" text-anchor="middle" class="note">assignments + metrics</text>

  <rect x="820" y="580" width="200" height="44" class="box"/>
  <text x="920" y="600" text-anchor="middle" class="label">EventBridge 9:00 ’ digest »</text>
  <text x="920" y="616" text-anchor="middle" class="note">SNS mini-jira-daily-digest</text>

  <rect x="820" y="640" width="200" height="44" class="box"/>
  <text x="920" y="667" text-anchor="middle" class="label">CloudWatch MiniJira + alarms</text>

  <line x1="460" y1="400" x2="820" y2="302" stroke="#64748b" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="460" y1="400" x2="820" y2="362" stroke="#64748b" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="460" y1="400" x2="868" y2="422" stroke="#64748b" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="972" y1="400" x2="920" y2="460" stroke="#64748b" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
</svg>
